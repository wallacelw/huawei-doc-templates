name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra texlive-lang-portuguese latexmk
      - name: Install Pandoc
        run: |
          sudo apt-get install -y pandoc python3-docx python3-lxml
      - name: Install fonts
        run: |
          # Install HarmonyOS Sans and Cascadia Code fonts
          mkdir -p ~/.fonts
          if [ -d templates/guide/common-assets/fonts ]; then
            cp templates/guide/common-assets/fonts/* ~/.fonts/ 2>/dev/null || true
          fi
          if [ -d templates/technical/common-assets/fonts ]; then
            cp templates/technical/common-assets/fonts/* ~/.fonts/ 2>/dev/null || true
          fi
          fc-cache -f
      - name: Run tests
        run: make test
      - name: Compile samples
        run: make samples
